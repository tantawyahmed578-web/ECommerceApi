version: '3.4'

services:
  ecommerce-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # ركز هنا: غيرنا الـ Server لـ sqlserver عشان يشوف الكونتينر التاني
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ECommerceApiDb;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;
      # وهنا خلينا الـ Redis يبص على الكونتينر بتاعه
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      - sqlserver
      - redis

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Pass123
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  sqldata: